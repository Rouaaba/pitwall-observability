name: Terraform Drift Check

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift-grafana:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
      TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
    outputs:
      drifted: ${{ steps.plan.outputs.drifted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_dashboards.py
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - working-directory: terraform/grafana
        run: terraform init
      - id: plan
        working-directory: terraform/grafana
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan_output.txt
          code=${PIPESTATUS[0]}
          # detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present
          if [ "$code" = "2" ]; then echo "drifted=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = "1" ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.drifted == 'true'
        with:
          name: drift-plan-grafana
          path: terraform/grafana/plan_output.txt

  drift-github:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_github_token: ${{ secrets.GH_TERRAFORM_TOKEN }}
      TF_VAR_grafana_auth_secret: ${{ secrets.GRAFANA_AUTH }}
      TF_VAR_grafana_cloud_api_key_secret: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
      TF_VAR_tf_api_token_secret: ${{ secrets.TF_API_TOKEN }}
    outputs:
      drifted: ${{ steps.plan.outputs.drifted }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - working-directory: terraform/github
        run: terraform init
      - id: plan
        working-directory: terraform/github
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan_output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" = "2" ]; then echo "drifted=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = "1" ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.drifted == 'true'
        with:
          name: drift-plan-github
          path: terraform/github/plan_output.txt

  open-issue-on-drift:
    runs-on: ubuntu-latest
    needs: [drift-grafana, drift-github]
    if: needs.drift-grafana.outputs.drifted == 'true' || needs.drift-github.outputs.drifted == 'true'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const grafanaDrifted = '${{ needs.drift-grafana.outputs.drifted }}' === 'true';
            const githubDrifted = '${{ needs.drift-github.outputs.drifted }}' === 'true';
            const modules = [grafanaDrifted && 'terraform/grafana', githubDrifted && 'terraform/github'].filter(Boolean).join(', ');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform drift detected: ${modules}`,
              body: `The nightly drift check found changes outside Terraform in: **${modules}**.\n\nSee the \`drift-plan-*\` artifacts on this run for the full plan output:\nhttps://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nEither apply the drifted change back into source, or run \`terraform apply\` manually if it's intentional (e.g. a UI edit that should be exported first -- see docs/DEPLOY.md).`,
              labels: ['terraform-drift'],
            });
