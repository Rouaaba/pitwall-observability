name: Terraform PR

on:
  pull_request:
    paths:
      - "dashboards/**"
      - "terraform/**"
      - "scripts/build_dashboards.py"
      - ".github/workflows/terraform-pr.yml"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  # Python tests/lint already run unconditionally on every push/PR via
  # .github/workflows/ci.yml -- not duplicated here.
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboards/package-lock.json
      - working-directory: dashboards
        run: npm ci
      - working-directory: dashboards
        run: npm run lint

  build-dashboards:
    runs-on: ubuntu-latest
    needs: lint-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_dashboards.py
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-grafana-build
          path: terraform/grafana/build/

  terraform-grafana:
    runs-on: ubuntu-latest
    needs: build-dashboards
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
      TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: terraform-grafana-build
          path: terraform/grafana/build/
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - name: terraform fmt -check
        working-directory: terraform/grafana
        run: terraform fmt -check -recursive
      - name: terraform init
        working-directory: terraform/grafana
        run: terraform init
      - name: terraform validate
        working-directory: terraform/grafana
        run: terraform validate
      - name: terraform plan
        working-directory: terraform/grafana
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
      - name: Post plan as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/grafana/plan_output.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan: \`terraform/grafana\`\n\`\`\`\n${plan}\n\`\`\``,
            });

  terraform-github:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      # A PAT with repo scope on pitwall-data, not the ephemeral
      # secrets.GITHUB_TOKEN -- that token can't manage another repo's
      # deploy keys/secrets or this repo's own Actions secrets.
      TF_VAR_github_token: ${{ secrets.GH_TERRAFORM_TOKEN }}
      TF_VAR_grafana_auth_secret: ${{ secrets.GRAFANA_AUTH }}
      TF_VAR_grafana_cloud_api_key_secret: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
      TF_VAR_tf_api_token_secret: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - name: terraform fmt -check
        working-directory: terraform/github
        run: terraform fmt -check -recursive
      - name: terraform init
        working-directory: terraform/github
        run: terraform init
      - name: terraform validate
        working-directory: terraform/github
        run: terraform validate
      - name: terraform plan
        working-directory: terraform/github
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
      - name: Post plan as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/github/plan_output.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan: \`terraform/github\`\n\`\`\`\n${plan}\n\`\`\``,
            });
